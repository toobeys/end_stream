
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toobey Neon Starting Soon</title>
<style>
:root{--cyan:#55f3ff;--pink:#ff4fd8;--white:#f7f8ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030d;font-family:"Courier New",monospace}
body{display:grid;place-items:center}
.screen{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);aspect-ratio:9/16;overflow:hidden;display:grid;place-items:center;color:var(--white);container-type:size;
background:radial-gradient(ellipse at 50% 42%,rgba(35,38,135,.58),transparent 56%),radial-gradient(circle at 12% 18%,rgba(255,79,216,.18),transparent 29%),radial-gradient(circle at 88% 78%,rgba(85,243,255,.16),transparent 30%),linear-gradient(180deg,#02030d,#08051b 55%,#030611)}
.grid{position:absolute;inset:42% -50% -25%;opacity:.4;background-image:linear-gradient(rgba(85,243,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(85,243,255,.5) 1px,transparent 1px);background-size:4.82cqw 3.52cqw;transform:perspective(30cqw) rotateX(58deg);transform-origin:top center;mask-image:linear-gradient(to bottom,transparent,#000 18%,#000)}
.stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:7.7cqw 9cqw;opacity:.35;animation:drift 24s linear infinite}
.stars:before{background-size:12.1cqw 11cqw;opacity:.45;animation-duration:34s}
.stars:after{background-size:5.3cqw 6.6cqw;opacity:.2;animation-duration:17s}
@keyframes drift{to{transform:translateY(9cqw)}}
.scanlines{position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(to bottom,transparent 0 3px,#000 4px 5px)}
.orb{position:absolute;width:36cqw;height:36cqw;border-radius:50%;filter:blur(5cqw);opacity:.18;pointer-events:none;animation:pulse 5s ease-in-out infinite alternate}
.orb.a{top:18%;left:-18%;background:var(--pink)}
.orb.b{right:-18%;bottom:15%;background:var(--cyan);animation-delay:-2.5s}
@keyframes pulse{to{transform:scale(1.35);opacity:.3}}
.content{position:relative;z-index:2;width:83.33cqw;text-align:center;padding:4.63cqw 2.22cqw;transform:translateY(-1.85cqw)}
.content:before{content:"";position:absolute;inset:-5cqw -3cqw;z-index:-1;border:1px solid rgba(85,243,255,.3);border-radius:2cqw;box-shadow:inset 0 0 4cqw rgba(85,243,255,.08),0 0 3cqw rgba(255,79,216,.14);pointer-events:none}
.star-icon{width:10.2cqw;height:8.33cqw;margin:0 auto 5.37cqw;position:relative;filter:drop-shadow(0 0 1.8cqw var(--cyan))}
.star-icon:before{content:"✦";position:absolute;inset:0;display:grid;place-items:center;font-size:8.52cqw;color:var(--cyan);text-shadow:.65cqw .65cqw 0 var(--pink);animation:float 2.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-1.1cqw) rotate(8deg)}}
.eyebrow{color:var(--cyan);font-size:2.04cqw;letter-spacing:.42em;margin-bottom:2.78cqw;text-transform:uppercase;text-shadow:0 0 1.2cqw var(--cyan),0 0 2.5cqw rgba(85,243,255,.55)}
h1{margin:0;font-size:10.37cqw;line-height:.98;letter-spacing:.04em;font-weight:900;text-transform:uppercase;color:var(--white);text-shadow:0 0 .65cqw var(--white),.37cqw .37cqw 0 var(--pink),.74cqw .74cqw 0 rgba(85,243,255,.65),0 0 1.8cqw var(--cyan),0 0 4.5cqw rgba(85,243,255,.75),0 0 7cqw rgba(255,79,216,.35);animation:titlemove 3.2s ease-in-out infinite,glitch 6s steps(1) infinite}
@keyframes titlemove{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-1.48cqw) scale(1.025)}50%{transform:translateY(0) scale(1)}75%{transform:translateY(.93cqw) scale(.99)}}
@keyframes glitch{0%,91%,94%,100%{filter:none}92%{filter:drop-shadow(-.65cqw 0 var(--cyan)) drop-shadow(.65cqw 0 var(--pink))}93%{filter:drop-shadow(.46cqw 0 var(--cyan)) drop-shadow(-.46cqw 0 var(--pink))}}
.divider{width:39.8cqw;height:.37cqw;margin:5cqw auto 3.9cqw;background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);box-shadow:0 0 1.8cqw var(--cyan)}
.thanks{font-family:Arial,sans-serif;font-size:2.69cqw;font-weight:700;letter-spacing:.1em;margin:0;text-shadow:0 0 1.2cqw rgba(255,255,255,.4)}
.subline{font-family:Arial,sans-serif;font-size:2.5cqw;line-height:1.5;letter-spacing:.08em;margin:3.5cqw auto 0;color:rgba(247,248,255,.9);text-shadow:0 0 1.2cqw rgba(85,243,255,.35)}
.countdown{display:flex;justify-content:center;gap:2.3cqw;margin:4.3cqw auto 0}
.countdown span{width:10cqw;height:10cqw;display:grid;place-items:center;border:1px solid rgba(85,243,255,.65);border-radius:1.4cqw;color:var(--cyan);font-size:4.2cqw;font-weight:bold;background:rgba(85,243,255,.07);box-shadow:0 0 2cqw rgba(85,243,255,.18);animation:count 3s infinite}
.countdown span:nth-child(2){animation-delay:1s}
.countdown span:nth-child(3){animation-delay:2s}
@keyframes count{0%,25%,100%{opacity:.35;transform:scale(.92)}8%,18%{opacity:1;transform:scale(1.08);box-shadow:0 0 3cqw var(--cyan)}}
.handle{display:inline-block;margin-top:5cqw;padding:1.39cqw 2.59cqw;border:1px solid rgba(85,243,255,.9);color:var(--cyan);background:rgba(85,243,255,.09);border-radius:4px;font-size:1.85cqw;letter-spacing:.12em;text-shadow:0 0 1cqw var(--cyan);box-shadow:0 0 1.85cqw rgba(85,243,255,.35),inset 0 0 1.5cqw rgba(85,243,255,.12)}
.bottom{position:absolute;z-index:2;bottom:4.43cqh;left:0;width:100%;text-align:center;color:rgba(210,220,255,.65);font-size:1.39cqw;letter-spacing:.3em;text-shadow:0 0 1cqw var(--cyan)}
</style>
</head>
<body>
<main class="screen">
<div class="stars"></div>
<div class="grid"></div>
<div class="scanlines"></div>
<div class="orb a"></div>
<div class="orb b"></div>

<section class="content">
<div class="star-icon" aria-hidden="true"></div>
<div class="eyebrow">Get Ready · Stream Starting</div>
<h1>Starting<br>Soon</h1>
<div class="divider"></div>
<p class="thanks">WE'RE GETTING READY!</p>
<p class="subline">LIVE akan segera dimulai.<br>Siapkan diri dan jangan ke mana-mana!</p>

<div class="countdown">
<span>3</span>
<span>2</span>
<span>1</span>
</div>

<div class="handle">@TOOBEY</div>
</section>

<div class="bottom">PLEASE WAIT · THE GAME IS ABOUT TO BEGIN</div>
</main>
</body>
</html>
