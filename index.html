
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok LIVE — Starting Soon</title>
<style>
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
}
body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(ellipse at 50% 38%,rgba(24,90,210,.35),transparent 48%),
    radial-gradient(ellipse at 15% 85%,rgba(145,35,255,.26),transparent 38%),
    radial-gradient(ellipse at 88% 18%,rgba(0,220,255,.18),transparent 32%),
    linear-gradient(145deg,#05091f 0%,#101044 48%,#090b2b 100%);
}
.stage{
  width:min(100vw,56.25vh);
  height:min(100vh,177.7778vw);
  aspect-ratio:9/16;
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:7% 6%;
  text-align:center;
}
.stage::before,.stage::after{
  content:"";
  position:absolute;
  inset:-30%;
  background:repeating-linear-gradient(
    115deg,transparent 0 90px,
    rgba(65,170,255,.055) 91px 93px,
    transparent 94px 180px
  );
  animation:drift 24s linear infinite;
  z-index:-1;
}
.stage::after{
  transform:rotate(180deg);
  opacity:.45;
  animation-duration:32s;
}
@keyframes drift{
  to{transform:translate3d(7%,-5%,0)}
}
.orb{
  position:absolute;
  width:42%;
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid rgba(0,220,255,.14);
  box-shadow:0 0 70px rgba(0,160,255,.10),
  inset 0 0 70px rgba(140,50,255,.08);
  animation:pulse 5s ease-in-out infinite;
  z-index:-1;
}
.orb.one{top:8%;left:-23%}
.orb.two{
  bottom:-22%;right:-20%;
  animation-delay:1.5s;
  border-color:rgba(220,55,255,.18);
}
@keyframes pulse{
  50%{transform:scale(1.13);opacity:.45}
}
.live{
  display:inline-flex;
  align-items:center;
  gap:12px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:999px;
  padding:12px 25px;
  background:rgba(5,12,40,.65);
  box-shadow:0 0 24px rgba(0,220,255,.22);
  font-weight:800;
  letter-spacing:.16em;
  font-size:clamp(12px,2vw,22px);
  animation:float 3s ease-in-out infinite;
}
.dot{
  width:11px;height:11px;
  border-radius:50%;
  background:#ff315d;
  box-shadow:0 0 15px #ff315d;
  animation:blink 1.2s infinite;
}
@keyframes blink{
  50%{opacity:.25}
}
.headline{
  margin:7% 0 2%;
  line-height:.92;
  font-weight:1000;
  letter-spacing:-.055em;
  text-transform:uppercase;
  animation:headlineIn 1.2s cubic-bezier(.2,.8,.2,1) both,
  glow 3s ease-in-out 1.2s infinite;
}
.headline span{display:block}
.stream{
  font-size:clamp(48px,11vw,150px);
  color:#fff;
  text-shadow:0 5px 0 #263c91,
  0 10px 35px rgba(0,180,255,.55);
}
.soon{
  font-size:clamp(64px,15vw,205px);
  background:linear-gradient(
    180deg,#fff58b 0%,#ffd32e 42%,#ff8a22 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 7px 0 #7c2e80)
  drop-shadow(0 0 24px rgba(255,180,40,.42));
}
@keyframes headlineIn{
  from{opacity:0;transform:translateY(55px) scale(.82)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes glow{
  50%{filter:drop-shadow(0 0 24px rgba(0,220,255,.45))}
}
.rule{
  width:72%;
  height:3px;
  margin:5% 0;
  background:linear-gradient(
    90deg,transparent,#00eaff,#b64cff,#ff4dbe,transparent
  );
  box-shadow:0 0 18px #00dfff;
}
.ready{
  font-size:clamp(25px,5.3vw,70px);
  font-weight:900;
  letter-spacing:-.035em;
  text-shadow:0 0 22px rgba(0,210,255,.55);
  animation:rise 1.4s .5s both,
  gentle 3.2s 2s ease-in-out infinite;
}
.ready em{
  color:#ffe05b;
  font-style:normal;
}
@keyframes rise{
  from{opacity:0;transform:translateY(45px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes gentle{
  50%{transform:translateY(-10px)}
}
.countdown{
  display:flex;
  justify-content:center;
  gap:clamp(12px,3vw,34px);
  margin:7% 0;
}
.count{
  width:clamp(65px,17vw,150px);
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22%;
  border:2px solid var(--c);
  color:#fff;
  background:rgba(7,10,38,.7);
  box-shadow:0 0 22px var(--c);
  font-size:clamp(30px,7vw,75px);
  font-weight:1000;
  animation:countPulse 3s ease-in-out infinite;
}
.count:nth-child(2){animation-delay:.4s}
.count:nth-child(3){animation-delay:.8s}
@keyframes countPulse{
  50%{
    transform:translateY(-9px) scale(1.06);
    box-shadow:0 0 34px var(--c);
  }
}
.message{
  padding:17px 25px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
  background:linear-gradient(
    90deg,rgba(0,210,255,.13),rgba(155,60,255,.2)
  );
  font-size:clamp(17px,3.2vw,38px);
  font-weight:800;
  box-shadow:0 0 30px rgba(120,70,255,.28);
  animation:byeGlow 3s ease-in-out infinite;
}
@keyframes byeGlow{
  50%{box-shadow:0 0 42px rgba(0,220,255,.48)}
}
.spark{
  position:absolute;
  color:#fff;
  font-size:clamp(14px,3vw,30px);
  text-shadow:0 0 15px #00dfff;
  animation:twinkle 2.4s ease-in-out infinite;
}
.s1{top:15%;left:13%}
.s2{top:26%;right:12%;animation-delay:.6s}
.s3{bottom:20%;left:17%;animation-delay:1.1s}
.s4{bottom:14%;right:16%;animation-delay:1.6s}
@keyframes twinkle{
  0%,100%{opacity:.25;transform:scale(.7) rotate(0)}
  50%{opacity:1;transform:scale(1.3) rotate(25deg)}
}
@keyframes float{
  50%{transform:translateY(-8px)}
}
@media(max-aspect-ratio:3/5){
  .headline{margin-top:5%}
  .countdown{margin:5% 0}
  .count{border-radius:15%}
}
</style>
</head>
<body>
<main class="stage">

  <div class="orb one"></div>
  <div class="orb two"></div>

  <span class="spark s1">✦</span>
  <span class="spark s2">✧</span>
  <span class="spark s3">✦</span>
  <span class="spark s4">✧</span>

  <div class="live">
    <span class="dot"></span>
    TIKTOK LIVE
  </div>

  <h1 class="headline">
    <span class="stream">STREAM</span>
    <span class="soon">SOON</span>
  </h1>

  <div class="rule"></div>

  <div class="ready">
    We're <em>Getting Ready!</em>
  </div>

  <div class="countdown">
    <div class="count" style="--c:#ff3d86">3</div>
    <div class="count" style="--c:#00dfff">2</div>
    <div class="count" style="--c:#b66aff">1</div>
  </div>

  <div class="message">
    Stay Tuned & Enjoy the Stream!
  </div>

</main>
</body>
</html>
